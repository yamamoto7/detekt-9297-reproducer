name: Reproduce detekt#9297

on:
  push:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Light mode: works and reports only Screen.kt:6.
      - name: detekt (light mode)
        run: ./gradlew detekt --console=plain

      # Full mode: crashes with "findFirCompiledSymbol only works on compiled declarations".
      # This step is expected to fail while the bug exists.
      - name: detektMain (full mode)
        run: ./gradlew detektMain --console=plain
